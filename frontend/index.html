<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AAVIN WhatsApp Automation</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand-header">
                <img src="aavin-logo.png" alt="AAVIN Logo" class="login-logo">
                <h1>AAVIN AUTOMATION</h1>
                <p>Enterprise WhatsApp Distribution Platform</p>
            </div>
            
            <form id="loginForm">
                <div id="errorMessage" class="error-message hidden"></div>
                
                <div class="form-group">
                    <label for="email">Admin Email</label>
                    <input type="email" id="email" name="email" required placeholder="admin@aavin.tn.gov.in" autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••••••" autocomplete="current-password">
                </div>
                
                <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 13px;">
                    <span id="btnText">Sign In to Console</span>
                    <span id="btnLoader" class="loader hidden"></span>
                </button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
